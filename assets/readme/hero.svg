<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" aria-labelledby="title desc" role="img" viewBox="0 0 1200 360"><title id="title">彩虹易支付系统 - PHP 开源支付聚合网关</title><desc id="desc">深色画布上，左侧为品牌标题与价值说明，右侧为支付宝、微信、QQ钱包、财付通、银联五个支付渠道汇聚到易支付网关的架构图。</desc><defs><linearGradient id="rainbow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#FF5E5B"/><stop offset="17%" stop-color="#FF9F1C"/><stop offset="33%" stop-color="#FFD23F"/><stop offset="50%" stop-color="#4CDB6C"/><stop offset="67%" stop-color="#2EC4B6"/><stop offset="83%" stop-color="#4B8BFF"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4B8BFF" stop-opacity=".16"/><stop offset="100%" stop-color="#4B8BFF" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="360" fill="#0B1220" rx="24"/><circle cx="915" cy="195" r="180" fill="url(#glow)"/><g id="title-block"><text y="18" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" transform="translate(56 44)">PHP 开源支付聚合网关</text><text y="104" fill="url(#rainbow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" transform="translate(56 44)">彩虹</text><text x="174" y="104" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" transform="translate(56 44)">易支付</text><text x="408" y="104" fill="#8CA0BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" transform="translate(56 44)">系统</text><text y="158" fill="#D6E1F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" transform="translate(56 44)">一站式免签约收款，一个 API 对接全渠道</text><text y="206" fill="#8CA0BC" font-family="ui-monospace, SFMono-