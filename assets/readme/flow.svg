<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" aria-labelledby="title desc" role="img" viewBox="0 0 1200 240"><title id="title">彩虹易支付支付流程</title><desc id="desc">六步流程：商户系统签名下单，易支付网关分发到支付渠道，支付完成后异步回调商户，商户验签后发货。</desc><defs><linearGradient id="rainbow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#FF5E5B"/><stop offset="17%" stop-color="#FF9F1C"/><stop offset="33%" stop-color="#FFD23F"/><stop offset="50%" stop-color="#4CDB6C"/><stop offset="67%" stop-color="#2EC4B6"/><stop offset="83%" stop-color="#4B8BFF"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient></defs><rect width="1200" height="240" fill="#0B1220" rx="24"/><g id="flow-steps"><g><circle cx="131" cy="52" r="22" fill="#131C2E" stroke="#26334D" stroke-width="1.5"/><text x="131" y="59" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">&lt;/&gt;</text><text x="131" y="112" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" text-anchor="middle">商户系统</text><text x="131" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">your app</text></g><g><circle cx="307" cy="52" r="22" fill="#131C2E" stroke="#26334D" stroke-width="1.5"/><text x="307" y="59" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">MD5</text><text x="307" y="112" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" text-anchor="middle">签名下单</text><text x="307" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">RSA · MD5 签名</text></g><g><circle cx="483" cy="52" r="22" fill="url(#rainbow)" stroke-width="0"/><text x="483" y="59" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">易</text><text x="483" y="112" fill="url(#rainbow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">易支付网关</text><text x="483" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">gateway 分发</text></g><g><circle cx="659" cy="52" r="22" fill="#131C2E" stroke="#26334D" stroke-width="1.5"/><text x="659" y="59" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">¥</text><text x="659" y="112" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" text-anchor="middle">渠道支付</text><text x="659" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">支付宝 · 微信 · QQ</text></g><g><circle cx="835" cy="52" r="22" fill="#131C2E" stroke="#26334D" stroke-width="1.5"/><text x="835" y="59" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">↩</text><text x="835" y="112" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" text-anchor="middle">异步回调</text><text x="835" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">notify 验签</text></g><g><circle cx="1011" cy="52" r="22" fill="#131C2E" stroke="#26334D" stroke-width="1.5"/><text x="1011" y="59" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">✓</text><text x="1011" y="112" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" text-anchor="middle">订单完成</text><text x="1011" y="142" fill="#8CA0BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">商户发货</text></g><g fill="#3B82F6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" text-anchor="middle"><text x="223" y="60">→</text><text x="399" y="60">→</text><text x="575" y="60">→</text><text x="751" y="60">→</text><text x="927" y="60">→</text></g></g><text x="600" y="200" fill="#8CA0BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">支付完成后，系统异步通知 notify_url，商户验签后更新订单状态</text></svg>